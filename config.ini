[Network]
# Client Production Path:
# ServerPath = \\<SERVER_IP_OR_HOSTNAME>\<SHARE_PATH>\ContXpps
# Local Mock Server Path:
ServerPath = ./test_server_mock

[CONSTANTS]

[Security]
# System settings are managed centrally on the server via Admin Dashboard.

[WORKFLOW]
auto_dispatch_bom = False

[SMTP]
smtp_server = smtp.example.com
smtp_port = 465
sender_email = demo-agent@example.com
sender_password = <YOUR_SMTP_PASSWORD_OR_APP_TOKEN>

[IMAP]
imap_server = imap.example.com
imap_port = 993
email_address = demo-agent@example.com
email_password = <YOUR_IMAP_PASSWORD_OR_APP_TOKEN>

[AGENTS_LLM]
# Provider options: local (Ollama/Rule Engine), gemini, openai
# Central Brain Orchestrator (High Intelligence & NLP Reasoning)
brain_agent_provider = gemini
brain_agent_model = gemini-2.0-flash

# Specialized Module Workers (Instant Local Rule Engines & Deterministic Algorithms)
bom_agent_provider = local
bom_agent_model = rule-engine

sourcing_agent_provider = local
sourcing_agent_model = rule-engine

cycletime_agent_provider = local
cycletime_agent_model = rule-engine

costing_agent_provider = local
costing_agent_model = rule-engine

npi_agent_provider = local
npi_agent_model = rule-engine

wi_agent_provider = local
wi_agent_model = rule-engine

# API Endpoints & Keys
ollama_endpoint = http://localhost:11434
gemini_api_key = <YOUR_GEMINI_API_KEY>
openai_api_key = <YOUR_OPENAI_API_KEY>

[PROMPT_GUARD]
# Comma-separated extra deny phrases (optional). Injection rules are built-in.
global_deny =
# Optional per-module allow tokens. Empty = no extra allow-list (cross-module deny still applies).
bom_allow = rfq,mapping,moq,bom,part,mpn,eau
sourcing_allow = quote,supplier,mpn,moq,lead
cycletime_allow = cycle,drawing,awg,nre,process
costing_allow = quote,margin,labor,cost,sga
npi_allow = rpn,risk,category,mpn
wi_allow = layout,work instruction,process,photo

